      if (st.type === "limit"){
        it.max = parseInt(st.max, 10);
        if (!(it.max >= 1 && it.max <= 30)){ toast("Set a max between 1 and 30"); return; }
      }
      if (st.type === "workout"){ it.note = ""; it.list = lines(st.list); }
      if (st.type === "multi"){
        it.subs = st.subs.split(",").map(x=>x.trim()).filter(Boolean);
        if (!it.subs.length){ toast("Add at least one box name"); return; }
      }
      S.items.push(it);
      save(); m.remove(); render();
      if (!st.days.includes(ui.day)) toast(`Added — it'll show on ${st.days.map(d=>SHORT[d]).join(", ")}`);
      else toast("Added");
    }
  });
  draw();
  document.body.appendChild(m);
  setTimeout(()=>{ const i = document.getElementById("as-name"); if (i) i.focus(); }, 50);
}

function applyTheme(){
  const r = document.documentElement;
  if (S.theme === "auto") r.removeAttribute("data-theme"); else r.setAttribute("data-theme", S.theme);
  SKY.apply();
}

/* ---------- actions ---------- */
function stepDay(n){
  const date = addDays(fromKey(ui.week), ui.day + n);
  ui.week = keyOf(mondayOf(date)); ui.day = dow(date);
  nav(n);
}
const findItem = id => S.items.find(i => i.id === id);
const today = () => { NOW = nowInfo(); ui.week = NOW.week; ui.day = NOW.day; };

document.addEventListener("click", async e => {
  if (Date.now() - (ui.swiped || 0) < 400) return;   // the tail end of a swipe isn't a tap
  if (e.isTrusted) ui.tapX = e.clientX;
  const el = e.target.closest("[data-act]");
  if (!el) return;
  switch (el.dataset.act){
    case "tab": {
      const was = ui.week + ui.day;
      if (el.dataset.t === "today") today();
      const now = ui.week + ui.day;
      if (ui.tab === "today" && el.dataset.t === "today" && now !== was){ nav(now > was ? 1 : -1); break; }
      go(el.dataset.t); break;
    }
    case "today": { const was = ui.week + ui.day; today(); const now = ui.week + ui.day; if (now !== was) nav(now > was ? 1 : -1); else render(); break; }
    case "wk": ui.week = keyOf(addDays(fromKey(ui.week), 7*Number(el.dataset.n))); nav(Number(el.dataset.n)); break;
    case "wknow": { const was = ui.week; today(); if (ui.week !== was) nav(ui.week > was ? 1 : -1); else render(); break; }
    case "openday":
      ui.day = Number(el.dataset.d); ui.scrollId = el.dataset.check ? "weeklycheck" : null; go("today");
      break;
    case "day": stepDay(Number(el.dataset.n)); break;
    case "tdadd": todoSheet(); break;
    case "tdedit": todoSheet(S.todos.find(t => t.id === el.dataset.id)); break;
    case "tdopen": ui.todoOpen = ui.todoOpen === el.dataset.id ? null : el.dataset.id; render(); break;
    case "tdmore": ui.todoDone = !ui.todoDone; render(); break;
    case "tdstep": {
      const t = S.todos.find(x => x.id === el.dataset.id), st = t.steps[Number(el.dataset.i)];
      st.done = !st.done; if (st.done) ui.just = t.id + ":" + el.dataset.i;
      save(); render(); break;
    }
    case "tddone": {
      const t = S.todos.find(x => x.id === el.dataset.id);
      t.done = NOW.date; if (ui.todoOpen === t.id) ui.todoOpen = null;
      save(); render(); toast(`Done: ${t.name} 💧`); break;
    }
    case "tdundo": { const t = S.todos.find(x => x.id === el.dataset.id); delete t.done; ui.just = t.id; save(); render(); break; }
    case "tddel": {
      const t = S.todos.find(x => x.id === el.dataset.id);
      if (await ask(`Remove “${t.name}”?`, "Remove")){ S.todos = S.todos.filter(x => x !== t); save(); render(); }
      break;
    }
    case "lazy": {
      const on = el.dataset.v === "1";
      if (on && lazyDayIn(ui.week) != null) break;
      if (on){
        const p = prog(ui.week, ui.day);
        if (p.total && p.done === p.total){ toast("This day's already full. Save the lazy day 💧"); break; }
        if (!(await lazyCheck())) break;
      }
      const rec = dayRec(ui.week, ui.day);
      if (on) rec.lazy = true; else delete rec.lazy;
      save(); render();
      if (on) toast("Lazy day. Streak's safe 💤");
      break;
    }
    case "appadd": {
      const ch = wk(ui.week).check; ch.apps = ch.apps || []; ch.apps.push({name:"", h:""});
      save(); render();
      const ins = document.querySelectorAll('[data-app$="|name"]'); if (ins.length) ins[ins.length - 1].focus();
      break;
    }
    case "appdel": { const ch = wk(ui.week).check; (ch.apps || []).splice(Number(el.dataset.i), 1); save(); render(); break; }
    case "tick": {
      const before = isFull(ui.week, ui.day);
      const c = dayRec(ui.week, ui.day).c, k = el.dataset.k;
      if (c[k]){ delete c[k]; ui.event = "wobble"; } else { c[k] = true; ui.just = k; ui.event = "tick"; }
      const finished = !before && isFull(ui.week, ui.day);
      if (finished) ui.event = "finale";
      save(); render();
      if (finished) setTimeout(() => toast("Full day — filled to the top 💧"), 500);
      break;
    }
    case "limit": {
      const rec = dayRec(ui.week, ui.day), k = el.dataset.k, i = Number(el.dataset.i), it = findItem(k);
      rec.n = rec.n || {};
      rec.n[k] = (rec.n[k] === i+1) ? i : i+1;
      if (rec.n[k] === i+1) ui.just = k + "#" + i;
      save(); render();
      if (it && rec.n[k] >= it.max) toast(`That's your ${it.max} for today.`);
      break;
    }
    case "statwk": ui.statWeek = Number(el.dataset.i); render(); break;
    case "edlog": { const it = findItem(el.dataset.id), f = el.dataset.f; it[f] = !it[f]; save(); render(); break; }
    case "edicon": { const it = findItem(el.dataset.id), v = el.dataset.v; if (v === "auto") delete it.icon; else it.icon = v; save(); render(); break; }
    case "edtag": { const it = findItem(el.dataset.id); it.tag = it.tag === el.dataset.v ? "" : el.dataset.v; save(); render(); break; }
    case "addsheet": addSheet(); break;
    case "edopen": ui.open = ui.open === el.dataset.id ? null : el.dataset.id; render(); break;
    case "move": {
      const list = S.items, i = list.findIndex(x => x.id === el.dataset.id), j = i + Number(el.dataset.n);
      if (j < 0 || j >= list.length) break;
      [list[i], list[j]] = [list[j], list[i]]; save(); render(); break;
    }
    case "edday": {
      const it = findItem(el.dataset.id), d = Number(el.dataset.d);
      it.days = it.days.includes(d) ? it.days.filter(x => x !== d) : [...it.days, d].sort();
      save(); render(); break;
    }
    case "eddel": {
      const it = findItem(el.dataset.id);
      if (await ask(`Remove “${it.name}” from the list? Past ticks for it won't count any more.`, "Remove")){
        S.items.splice(S.items.indexOf(it), 1);
        ui.open = null; save(); render(); toast("Removed");
      }
      break;
    }
    case "theme": S.theme = el.dataset.t; save(); applyTheme(); render(); break;
    case "sky": S.sky = el.dataset.v; save(); SKY.apply(); render(); break;
    case "backup": backup(); break;
    case "restore": document.getElementById("restoreFile").click(); break;
    case "clearweek":
      if (await ask(`Clear all ticks and notes for the week of ${fmt(fromKey(ui.week))}?`, "Clear this week")){
        delete S.weeks[ui.week]; save(); render(); toast("Week cleared");
      }
      break;
    case "wipe":
      if (await ask("Start fresh? This wipes all your tasks and history. Can't be undone (unless you've got a backup).", "Wipe everything")){
        S = defaults(); save(); applyTheme(); ui.open = null; today(); go("today"); toast("Fresh start");
      }
      break;
  }
});

document.addEventListener("input", e => {
  const el = e.target;
  if (el.closest(".modal")) return;
  if (el.dataset.f){
    const k = el.dataset.f.split(".")[1];
    wk(ui.week).check[k] = el.value;
    save(); return;
  }
  if (el.dataset.app){
    const [i, f] = el.dataset.app.split("|"), ch = wk(ui.week).check;
    ch.apps = ch.apps || []; ch.apps[i] = ch.apps[i] || {}; ch.apps[i][f] = el.value;
    const tot = document.getElementById("appTotal"); if (tot) tot.textContent = appTotal(ch.apps);
    save(); return;
  }
  if (el.dataset.why){
    const ch = wk(ui.week).check; ch.why = ch.why || {}; ch.why[el.dataset.why] = el.value;
    save(); return;
  }
  if (el.dataset.m){
    const [id,f] = el.dataset.m.split("|"), rec = dayRec(ui.week, ui.day);
    rec.m = rec.m || {}; rec.m[id] = rec.m[id] || {}; rec.m[id][f] = el.value;
    save(); return;
  }
  const ed = el.dataset.e;
  if (!ed) return;
  const it = findItem(el.dataset.id);
  if (!it) return;
  if (ed === "subs") it.subs = el.value.split(",").map(s=>s.trim()).filter(Boolean);
  else if (ed === "ideas") it.ideas = lines(el.value);
  else if (ed === "list") it.list = lines(el.value);
  else if (ed === "max"){ const n = parseInt(el.value,10); if (n >= 1 && n <= 30) it.max = n; }
  else it[ed] = ed === "name" ? (el.value.trim() || "Untitled") : el.value;
  save();
});

async function backup(){
  const json = JSON.stringify(S);
  const name = `personal-tracker-backup-${NOW.date}.json`;
  const blob = new Blob([json], {type:"application/json"});
  try {
    const file = new File([blob], name, {type:"application/json"});
    if (navigator.canShare && navigator.canShare({files:[file]})){
      await navigator.share({files:[file], title:"Personal Tracker backup"});
      toast(backupSummary(S));
      return;
    }
  } catch(err){ if (err && err.name === "AbortError") return; }
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href), 5000);
  toast(backupSummary(S));
}
/* e.g. "Backed up 6 tasks and 41 days" */
function backupSummary(data, verb = "Backed up"){
  let days = 0;
  for (const k in (data.weeks || {})) for (const d in (data.weeks[k].days || {})){
    const r = data.weeks[k].days[d] || {};
    if (Object.keys(r.c || {}).length || r.lazy || Object.keys(r.n || {}).length || Object.keys(r.m || {}).length) days++;
  }
  const n = (data.items || []).length;
  const t = (data.todos || []).length;
  const bits = [`${n} task${n === 1 ? "" : "s"}`, `${days} day${days === 1 ? "" : "s"}`].concat(t ? [`${t} must do${t === 1 ? "" : "s"}`] : []);
  return `${verb} ${bits.slice(0, -1).join(", ")} and ${bits[bits.length - 1]}`;
}
document.getElementById("restoreFile").addEventListener("change", async e => {
  const f = e.target.files[0]; e.target.value = "";
  if (!f) return;
  try {
    const data = JSON.parse(await f.text());
    if (!data || !Array.isArray(data.items) || typeof data.weeks !== "object") throw new Error("bad");
    if (await ask(`Replace what's on this phone with that backup? It has ${backupSummary(data, "").trim()}.`, "Restore")){
      localStorage.setItem(KEY, JSON.stringify(data)); S = load(); save(); applyTheme(); render(); toast(backupSummary(S, "Restored"));
    }
  } catch(err){ toast("That file doesn't look like a backup"); }
});

/* new day / new week while the app sat open in the background */
/* swipe sideways on Today to change day: the page tracks your finger, carries on off the side
   in the same direction, and the next day slides in behind it in one motion */
(() => {
  let sx = 0, sy = 0, dx = 0, mode = null, busy = false, pts = [], frame = 0;
  const app = () => document.getElementById("app");
  const skip = t => t.closest("input, textarea, select, .seg, .modal, .sheet, .kinds, .dpick, .qtags, .tabs") ||
    [...function*(){ for (let n = t; n && n !== document.body; n = n.parentElement) yield n; }()].some(n => n.scrollWidth > n.clientWidth + 2 && getComputedStyle(n).overflowX !== "visible");
  const look = d => { const W = innerWidth; return {x: d*0.9, o: 1 - Math.min(0.45, Math.abs(d)/W*0.7)}; };
  const paint = () => { frame = 0; const a = app(), l = look(dx); a.style.transform = `translate3d(${l.x}px,0,0)`; a.style.opacity = l.o; };
  document.addEventListener("touchstart", e => {
    mode = null; dx = 0; pts = [];
    if (busy || ui.tab !== "today" || e.touches.length !== 1 || skip(e.target)) return;
    sx = e.touches[0].clientX; sy = e.touches[0].clientY; mode = "wait";
  }, {passive:true});
  document.addEventListener("touchmove", e => {
    if (!mode) return;
    const cx = e.touches[0].clientX, x = cx - sx, y = e.touches[0].clientY - sy;
    if (mode === "wait"){
      if (Math.abs(x) < 8 && Math.abs(y) < 8) return;
      mode = Math.abs(x) > Math.abs(y)*1.2 ? "swipe" : null;
      if (!mode) return;
      sx = cx; app().style.willChange = "transform, opacity";   // start from here so it doesn't jump
    }
    if (e.cancelable) e.preventDefault();
    const now = performance.now(); pts.push([now, cx]); while (pts.length > 2 && now - pts[0][0] > 90) pts.shift();
    dx = cx - sx;
    if (!reduceMotion() && !frame) frame = requestAnimationFrame(paint);
  }, {passive:false});
  const end = () => {
    if (mode !== "swipe"){ mode = null; return; }
    mode = null; ui.swiped = Date.now();
    if (frame){ cancelAnimationFrame(frame); frame = 0; }
    const a = app(), W = innerWidth, from = look(dx);
    const vx = pts.length > 1 ? (pts[pts.length-1][1] - pts[0][1])/Math.max(8, pts[pts.length-1][0] - pts[0][0]) : 0;   // px per ms, last ~90ms
    const go = Math.abs(dx) > W*0.22 || (Math.abs(vx) > 0.3 && Math.abs(dx) > 24 && Math.sign(vx) === Math.sign(dx));
    a.style.transform = ""; a.style.opacity = "";
    const settle = () => { a.style.willChange = ""; busy = false; };
    if (reduceMotion()){ settle(); if (go) stepDay(dx < 0 ? 1 : -1); return; }
    busy = true;
    if (!go){
      a.animate([{transform:`translate3d(${from.x}px,0,0)`, opacity:from.o}, {transform:"none", opacity:1}],
        {duration:380, easing:"cubic-bezier(.22,1.25,.36,1)"}).onfinish = settle;
      return;
    }
    const n = dx < 0 ? 1 : -1;
    // carry on at the speed the finger was going (this easing starts at 3x its average speed)
    const dist = Math.max(40, W*0.85 - Math.abs(from.x)), dur = Math.min(320, Math.max(150, 3*dist/Math.max(Math.abs(vx), 0.9)));
    const out = a.animate([{transform:`translate3d(${from.x}px,0,0)`, opacity:from.o}, {transform:`translate3d(${-n*(Math.abs(from.x) + dist)}px,0,0)`, opacity:0}],
      {duration:dur, easing:"cubic-bezier(.2,.6,.5,1)", fill:"forwards"});
    out.onfinish = () => {
      const date = addDays(fromKey(ui.week), ui.day + n);
      ui.week = keyOf(mondayOf(date)); ui.day = dow(date);
      render(); window.scrollTo(0,0); out.cancel();
      a.animate([{transform:`translate3d(${n*W*0.4}px,0,0)`, opacity:0}, {transform:"none", opacity:1}],
        {duration:440, easing:"cubic-bezier(.22,1,.36,1)"}).onfinish = settle;
    };
  };
  document.addEventListener("touchend", end);
  document.addEventListener("touchcancel", end);
})();

document.addEventListener("visibilitychange", () => {
  if (document.visibilityState !== "visible") return;
  const n = nowInfo();
  if (n.date !== NOW.date){
    const wasCurrent = ui.week === NOW.week && ui.day === NOW.day;
    NOW = n;
    if (wasCurrent){ ui.week = n.week; ui.day = n.day; }
    render();
  }
});

save();
applyTheme();
render();
updateBadge();

if ("serviceWorker" in navigator && location.protocol.startsWith("http")){
  window.addEventListener("load", () => navigator.serviceWorker.register("sw.js", {updateViaCache: "none"}).catch(()=>{}));
}
})();
